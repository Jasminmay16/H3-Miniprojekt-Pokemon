services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ConnectionStrings__PokemonDB: ${CONNECTION_STRING}
    networks:
      default:
        aliases:
          - h3pokemon-api

networks:
  default:
    name: dokploy-network
    external: true
